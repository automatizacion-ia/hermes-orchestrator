services:
  hermes:
    build: .
    container_name: hermes-orchestrator
    restart: unless-stopped
    env_file: .env
    environment:
      - HERMES_HOME=/var/lib/hermes
    ports:
      - "${WEBHOOK_PORT:-8644}:${WEBHOOK_PORT:-8644}"
      - "${WHATSAPP_QR_WEB_PORT:-80}:${WHATSAPP_QR_WEB_PORT:-80}"
    volumes:
      - hermes-data:/var/lib/hermes
      - .:/workspace:ro
      # Descomenta si quieres que Hermes use Docker como terminal backend
      # - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8644/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hermes-data:
